[package]
name = "rove-ui"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Rove: the Rune frontend for the Flea backend"

[[bin]]
name = "rove"
path = "src/main.rs"

[dependencies]
# Fonts come from AppSpec::fonts (Inter + JetBrains Mono), so Rune's embedded Inter is left out.
rune = { git = "https://github.com/anomalyco/rune", rev = "d6a0b3cc501f437a1ea2c1c994116f2c6034d3bb", default-features = false, features = ["accessibility", "dbus", "svg", "tooling"] }
png = "0.18"
