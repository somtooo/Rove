<style>
body{margin:0;background:#0B0C10}
.root{--accent:#7C9CFF;--ink:#0B0D14;--t1:#EDEFF5;--t2:rgba(237,239,245,.68);--t3:rgba(237,239,245,.52);--t4:rgba(237,239,245,.34);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.11);--hover:rgba(255,255,255,.05);--fill:rgba(255,255,255,.06);--fill2:rgba(255,255,255,.10);--fill3:rgba(255,255,255,.15);--danger:#FF7A7A;--warn:#F2C55C;--ok:#62D6A0;--acc-soft:color-mix(in oklab,var(--accent) 20%,transparent);--acc-line:color-mix(in oklab,var(--accent) 60%,transparent);--acc-text:color-mix(in oklab,var(--accent) 75%,white);position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--t1);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss03'}
.glass{--base:rgba(18,20,30,.52);--base-fx:blur(44px) saturate(1.7);--panel:rgba(13,15,22,.80);--panel-fx:blur(44px) saturate(1.3);--pop:rgba(32,35,48,.84);--pop-fx:blur(28px) saturate(1.7)}
.solid{--base:#0F1013;--base-fx:none;--panel:#17181C;--panel-fx:none;--pop:#212328;--pop-fx:none}
:where(.root) *{box-sizing:border-box}
:where(.root) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:where(.root) input{font:inherit;color:inherit;background:none;border:0;outline:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i14{width:14px;height:14px}.i16{width:16px;height:16px}.i20{width:20px;height:20px}.i24{width:24px;height:24px}
.ico{display:block;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}
.wall{position:absolute;inset:0;width:100%;height:100%}
.win{position:absolute;border-radius:16px;overflow:hidden;display:flex;background:var(--base);backdrop-filter:var(--base-fx);border:1px solid rgba(255,255,255,.10);box-shadow:0 40px 120px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.35)}
.side{width:244px;flex:none;display:flex;flex-direction:column;padding:12px 10px 12px 12px}
.panel{flex:1;min-width:0;margin:8px 8px 8px 0;border-radius:12px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:var(--panel-fx);border:1px solid var(--line);overflow:hidden;position:relative}
.sec{font-size:12px;line-height:16px;font-weight:500;color:var(--t3);padding:14px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--t2);font-size:14px;width:100%}
.row .i{color:var(--t3)}

.row.on .i{color:var(--accent)}

.row .end{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--t3);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tdot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}

.dev{display:flex;flex-direction:column;gap:6px;padding:7px 10px 9px;border-radius:8px}
.dev .top{display:flex;align-items:center;gap:10px;color:var(--t2);font-size:14px}
.dev .top .i{color:var(--t3)}
.tb{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border-radius:10px;background:var(--fill)}
.ib{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);flex:none}
.ib.on{background:var(--fill3);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.ib.dim{color:var(--t4)}
.title{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.015em}
.search{display:flex;align-items:center;gap:8px;height:32px;width:232px;padding:0 6px 0 10px;border-radius:10px;background:var(--fill);color:var(--t3);font-size:13px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-bottom-width:2px;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--t3);line-height:1;flex:none}
.keys{display:inline-flex;gap:3px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:500;background:var(--fill2);color:var(--t1);flex:none;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--ink);font-weight:600}
.btn.ghost{background:none;color:var(--t2)}
.btn.danger{background:color-mix(in oklab,var(--danger) 18%,transparent);color:var(--danger)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.lg{height:40px;padding:0 16px;font-size:14px;border-radius:11px}
.menu{position:absolute;width:260px;padding:5px;border-radius:12px;background:var(--pop);backdrop-filter:var(--pop-fx);border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);display:flex;flex-direction:column;z-index:20}
.mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px 0 10px;border-radius:7px;font-size:13.5px;color:var(--t1);width:100%}
.mi .i{color:var(--t2);width:16px;height:16px}
.mi .sc{margin-left:auto;font-size:12px;color:var(--t3)}
.mi .slot{width:16px;flex:none;display:flex}
.mi .slot .i{color:var(--accent);stroke-width:2.4}
.mi.hl{background:var(--accent);color:var(--ink)}
.mi.hl .i,.mi.hl .sc,.mi.hl .slot .i{color:rgba(11,13,20,.72)}
.mi.hl .kbd{background:rgba(11,13,20,.12);border-color:rgba(11,13,20,.14);color:rgba(11,13,20,.7)}
.mi.red{color:var(--danger)}.mi.red .i{color:var(--danger)}
.mi.dis{color:var(--t4)}.mi.dis .i{color:var(--t4)}
.msep{height:1px;background:var(--line2);margin:5px 8px}
.mlab{font-size:11.5px;font-weight:500;color:var(--t3);padding:6px 10px 3px}
.foot{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--t2)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0}
.crumb{display:flex;align-items:center;gap:6px;height:26px;padding:0 7px;border-radius:7px;color:var(--t2);white-space:nowrap}
.crumb .i{width:15px;height:15px;color:var(--t3)}
.crumb.cur{color:var(--t1);font-weight:500;background:var(--fill)}
.crumb.cur .i{color:var(--accent)}
.csep{color:var(--t4);width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}
.gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2);height:28px;letter-spacing:-.005em}
.gh .gc{font-weight:500;color:var(--t4)}
.gh .gl{flex:1;height:1px;background:var(--line)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:124px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px 10px;border-radius:12px;position:relative;text-align:center}
.tile .art{height:68px;display:flex;align-items:center;justify-content:center}
.tile .nm{font-size:13px;line-height:17px;font-weight:500;color:var(--t1);max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .mt{font-size:11.5px;line-height:14px;color:var(--t3);margin-top:-6px}
.tile.sel{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.tile.sel .nm{color:var(--t1)}
.tile.hov{background:var(--hover)}
.tile.cut{opacity:.45}
.tile.drop{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--acc-soft)}
.chk{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center}
.chk .i{width:11px;height:11px;stroke-width:3.2}
.thumb{display:block;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.35);position:relative;flex:none}
.thumb svg{display:block;width:100%;height:100%}
.thumb .play{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.thumb .play svg{width:12px;height:12px;margin-left:2px}
.thumb .dur{position:absolute;right:4px;bottom:4px;font-size:9.5px;font-weight:600;line-height:14px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff}
.tdots{display:flex;gap:3px;align-items:center}
.tdots .dot{width:7px;height:7px;box-shadow:0 0 0 1.5px var(--panel)}
.sw{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw.on{background:var(--accent)}
.sw.on::after{left:16px}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:9px;background:var(--fill);flex:none}
.seg>button{height:26px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--t2);font-weight:500;display:flex;align-items:center;gap:6px}
.seg>button.on{background:var(--fill3);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.seg>button.icon{width:30px;padding:0;justify-content:center}
.cb{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;flex:none}
.cb.on{background:var(--accent);box-shadow:none;color:var(--ink)}
.cb .i{width:12px;height:12px;stroke-width:3}
.rd{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);flex:none;position:relative}
.rd.on{box-shadow:inset 0 0 0 5px var(--accent)}
.field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2);font-size:13.5px;color:var(--t1)}
.field.focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent)}

.select{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 11px;border-radius:8px;background:var(--fill2);font-size:13px;font-weight:500;color:var(--t1)}
.select .i{color:var(--t3);width:14px;height:14px;margin-left:2px}
.card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border-radius:8px;font-size:13px;color:var(--t2);white-space:nowrap}
.tab .i{width:15px;height:15px;color:var(--t3)}
.tab.on{background:var(--fill2);color:var(--t1);font-weight:500}
.tab .x{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.tab .x .i{width:12px;height:12px}
.toast{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:12px;background:var(--pop);backdrop-filter:var(--pop-fx);border:1px solid var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.45)}

.light{--ink:#FFFFFF;--t1:#17191F;--t2:rgba(23,25,31,.70);--t3:rgba(23,25,31,.56);--t4:rgba(23,25,31,.38);--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.10);--hover:rgba(0,0,0,.04);--fill:rgba(0,0,0,.05);--fill2:rgba(0,0,0,.075);--fill3:#FFFFFF;--danger:#D63A4F;--warn:#C98A12;--ok:#2E9A5B;--acc-soft:color-mix(in oklab,var(--accent) 13%,transparent);--acc-line:color-mix(in oklab,var(--accent) 55%,transparent);color:var(--t1)}
.light.glass{--base:rgba(244,245,249,.62);--base-fx:blur(44px) saturate(1.8);--panel:rgba(255,255,255,.84);--panel-fx:blur(44px) saturate(1.4);--pop:rgba(255,255,255,.86);--pop-fx:blur(28px) saturate(1.8)}
.light.solid{--base:#ECEDF1;--panel:#FFFFFF;--pop:#FFFFFF}
.light .win{border-color:rgba(0,0,0,.08);box-shadow:0 40px 100px rgba(60,40,90,.22),0 8px 24px rgba(60,40,90,.12)}

.light .ib.on,.light .seg>button.on{box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
.light .tab.on{background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.06)}
.light .row.on{background:rgba(0,0,0,.065)}
.light .kbd{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.10);color:var(--t3)}
.light .mi.hl .i,.light .mi.hl .sc,.light .mi.hl .slot .i{color:rgba(255,255,255,.85)}
.light .mi.hl .kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);color:#fff}
.light .bar{background:rgba(0,0,0,.08)}
.light .ico{filter:drop-shadow(0 2px 4px rgba(30,40,80,.14))}
.light .thumb{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 12px rgba(30,40,80,.18)}
.light .tdots .dot{box-shadow:0 0 0 1.5px #fff}
.wallimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
